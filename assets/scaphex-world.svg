<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="Scaphex dark fantasy landscape with a moonlit fortress, ruined arches, violet crystals and a cloaked warrior">
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#080713"/><stop offset=".42" stop-color="#211333"/><stop offset=".72" stop-color="#11101d"/><stop offset="1" stop-color="#07070d"/></linearGradient>
 <radialGradient id="moon"><stop stop-color="#f2d8ff"/><stop offset=".42" stop-color="#c77aff"/><stop offset=".78" stop-color="#7934b6"/><stop offset="1" stop-color="#3b175c" stop-opacity="0"/></radialGradient>
 <linearGradient id="stone" x2=".8" y2="1"><stop stop-color="#77707f"/><stop offset=".28" stop-color="#383341"/><stop offset=".72" stop-color="#17151f"/><stop offset="1" stop-color="#08080e"/></linearGradient>
