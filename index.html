    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // Mobile menu toggle
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        
        mobileMenuBtn.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
            const isExpanded = !mobileMenu.classList.contains('hidden');
            mobileMenuBtn.setAttribute('aria-expanded', String(isExpanded));
            mobileMenuBtn.setAttribute('aria-label', isExpanded ? 'Close menu' : 'Open menu');
            const icon = mobileMenuBtn.querySelector('i');
            if (icon) {
                icon.setAttribute('data-lucide', isExpanded ? 'x' : 'menu');
                lucide.createIcons();
            }
        });

        // Close mobile menu when link clicked
        mobileMenu.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                mobileMenu.classList.add('hidden');
                mobileMenuBtn.setAttribute('aria-expanded', 'false');
                mobileMenuBtn.setAttribute('aria-label', 'Open menu');
                const icon = mobileMenuBtn.querySelector('i');
                if (icon) {
                    icon.setAttribute('data-lucide', 'menu');
                    lucide.createIcons();
                }
            });
        });

        // Load public YouTube uploads through a Netlify Function.
        // The function reads YouTube's public RSS feed server-side; no API key is exposed.
        async function fetchChannelData() {
            ['subscriber-count', 'video-count', 'view-count'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.textContent = '--';
            });

            try {
                const response = await fetch('/.netlify/functions/youtube-feed');
                if (!response.ok) throw new Error('YouTube feed request failed');
                const data = await response.json();
                const videos = Array.isArray(data.videos) ? data.videos.map(video => ({
                    videoId: video.videoId,
                    title: video.title || 'Untitled Video',
                    thumbnail: video.thumbnail || `https://i.ytimg.com/vi/${video.videoId}/hqdefault.jpg`,
                    views: '',
                    date: formatDate(video.publishedAt),
                    duration: ''
                })) : [];
                renderVideos(videos);
            } catch (error) {
                console.error('Unable to load YouTube uploads:', error);
                renderVideos([]);
            }
        }

        // Format relative date
        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffTime = Math.abs(now - date);
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            
            if (diffDays === 0) return 'Today';
            if (diffDays === 1) return 'Yesterday';
            if (diffDays < 7) return `${diffDays} days ago`;
            if (diffDays < 30) return `${Math.floor(diffDays / 7)} weeks ago`;
            if (diffDays < 365) return `${Math.floor(diffDays / 30)} months ago`;
            return `${Math.floor(diffDays / 365)} years ago`;
        }

        // Format ISO 8601 duration to readable time
        function formatDuration(duration) {
            if (!duration || typeof duration !== 'string') return '0:00';
            
            const match = duration.match(/PT(\d+H)?(\d+M)?(\d+S)?/);
            if (!match) return '0:00';
            
            const hours = (match[1] ? parseInt(match[1]) : 0);
            const minutes = (match[2] ? parseInt(match[2]) : 0);
            const seconds = (match[3] ? parseInt(match[3]) : 0);
            
            if (hours > 0) {
                return `${hours}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }
            return `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        // Render video grid
        function renderVideos(videos) {
            const videoGrid = document.getElementById('video-grid');
            const skeleton = document.getElementById('skeleton-loader');
            
            if (skeleton) {
                skeleton.style.display = 'none';
            }
            
            if (!videoGrid) {
                console.warn('Video grid element was not found.');
                return;
            }

            if (!videos || videos.length === 0) {
                videoGrid.innerHTML = '<div class="col-span-full text-center text-gray-400 py-12">No videos found</div>';
                return;
            }
            
            videoGrid.innerHTML = videos.map((video, index) => `
                <a href="https://youtube.com/watch?v=${video.videoId}" target="_blank" rel="noopener noreferrer" class="group cursor-pointer block video-card" style="animation-delay: ${index * 0.1}s">
                    <div class="relative overflow-hidden rounded-xl mb-3 aspect-video video-thumbnail bg-gray-800 shadow-lg video-container">
                        <img src="${video.thumbnail}" alt="${video.title}" loading="lazy" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
                        <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center backdrop-blur-sm">
                            <div class="w-16 h-16 rounded-full bg-red-600 flex items-center justify-center transform scale-0 group-hover:scale-100 transition-transform duration-300 shadow-xl">
                                <i data-lucide="play" class="w-8 h-8 text-white fill-white ml-1"></i>
                            </div>
                        </div>
                        ${video.duration ? `<div class="absolute bottom-2 right-2 bg-black/80 px-2 py-1 rounded text-xs font-semibold border border-white/10 text-white">${video.duration}</div>` : ''}
                    </div>
                    <h3 class="font-semibold text-lg mb-2 line-clamp-2 text-white group-hover:text-rs-gold transition-colors duration-300 leading-tight">${video.title}</h3>
                    <div class="flex items-center text-gray-400 text-sm space-x-2">
                        ${video.views ? `<span class="text-rs-gold-dark">${video.views}</span><span class="w-1 h-1 rounded-full bg-gray-600"></span>` : ''}
                        <span>${video.date}</span>
                    </div>
                </a>
            `).join('');
            
            lucide.createIcons();
        }

        // Initialize everything when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            fetchChannelData();
        });

        // Smooth scroll for anchor links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }
            });
        });

        // Navbar scroll effect
        window.addEventListener('scroll', () => {
            const nav = document.getElementById('navbar');
            if (!nav) return;
            if (window.scrollY > 50) {
                nav.classList.add('shadow-lg', 'bg-rs-dark/95');
                nav.classList.remove('bg-rs-dark/80');
            } else {
                nav.classList.remove('shadow-lg', 'bg-rs-dark/95');
                nav.classList.add('bg-rs-dark/80');
            }
        });

        // Intersection Observer for scroll animations
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                    entry.target.style.transform = 'translateY(0)';
                }
            });
        }, observerOptions);

        // Observe cards after page load
        setTimeout(() => {
            document.querySelectorAll('.card-hover, .stat-card').forEach((el) => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(20px)';
                el.style.transition = 'opacity 0.6s ease-out, transform 0.6s ease-out';
                observer.observe(el);
            });
        }, 100);
    </script>
